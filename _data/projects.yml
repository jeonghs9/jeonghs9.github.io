- title_en: "Deep Learning-Based Fashion Attribute Classification"
  title_ko: "패션 이미지 데이터를 활용한 딥러닝 기반 의류 속성 분류"
  organization: "Academic Research"
  summary_en: "Built clothing attribute classification models using 1M AI Hub fashion images, comparing ResNet50 and EfficientNetB0. The ResNet50 model reached a weighted F1-score of 0.800 and the work was published in the Smart Media Journal."
  summary_ko: "AI Hub 패션 이미지 100만장과 라벨 데이터를 활용해 상의와 하의 속성을 동시에 분류하는 모델을 개발했습니다. ResNet50과 EfficientNetB0를 비교했고, ResNet50 기준 Weighted F1-score 0.800을 달성해 스마트미디어저널에 논문이 등재되었습니다."
