---
layout: default
title: "기록"
description: "주요 이력 타임라인"
---

<section class="page-header shell">
  <h1>기록</h1>
  <p>업데이트, 프로젝트, 경력, 학력, 수상 기록을 시간순으로 정리합니다.</p>
</section>

<section class="section shell">
  <ol class="archive-list">
    {% for item in site.data.archive %}
      <li>
        <time>{{ item.date }}</time>
        <a href="{{ item.url | relative_url }}">{{ item.title_ko }}</a>
        <span class="news-category news-category-{{ item.category | downcase }}">{{ item.category }}</span>
      </li>
    {% endfor %}
  </ol>
</section>
