<article class="content-card">
  <img src="{{ include.publication.image | relative_url }}" alt="{{ include.publication.title_en }}">
  <div>
    <h3>{{ include.publication.title_en }}</h3>
    <p class="secondary">{{ include.publication.title_ko }}</p>
    <p>{{ include.publication.authors }}</p>
    <p class="meta">{{ include.publication.venue }} · {{ include.publication.year }}</p>
    <div class="link-row small">
      {% for link in include.publication.links %}
        <a href="{{ link.url }}">{{ link.label }}</a>
      {% endfor %}
    </div>
  </div>
</article>
